<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F3D"/>
      <stop offset="100%" stop-color="#081124"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="goldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Navy Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Golden Shield Outline (Security & Governance) -->
  <path d="M 64 24 
           C 84 24, 96 32, 96 46 
           C 96 74, 64 96, 64 100 
           C 64 96, 32 74, 32 46 
           C 32 32, 44 24, 64 24 Z" 
        fill="none" 
        stroke="url(#goldShield)" 
        stroke-width="5.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Ascending Financial Growth Arrow (Cutting through) -->
  <!-- Arrow Shaft -->
  <path d="M 28 88 L 84 36" 
        stroke="url(#arrowGrad)" 
        stroke-width="7" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Arrow Head -->
  <polygon points="98,24 74,28 88,42" 
           fill="url(#arrowGrad)" 
           filter="url(#glow)"/>

  <!-- Central Golden Coin (Indonesian Rupiah / Treasury) -->
  <circle cx="64" cy="62" r="23" fill="url(#goldLight)" stroke="#92400E" stroke-width="2" filter="url(#glow)"/>
  <circle cx="64" cy="62" r="19" fill="none" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3,2"/>
  
  <!-- Tiny Star above Rp -->
  <polygon points="64,50 65.5,53.5 69,53.8 66.3,56 67.2,59.5 64,57.5 60.8,59.5 61.7,56 59,53.8 62.5,53.5" fill="#92400E"/>

  <!-- Bold Rp Typography -->
  <text x="64" y="73" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="16" 
        font-weight="900" 
        fill="#78350F" 
        text-anchor="middle"
        letter-spacing="-0.5">Rp</text>
</svg>
